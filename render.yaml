services:
  - type: web
    name: upbms-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Set these in Render Dashboard → Environment tab ──
      - key: MONGODB_URI
        sync: false          # paste your Atlas URI here in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false          # Free transactional email on Render Free Tier (port 443 HTTPS)
      - key: RESEND_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false          # your Vercel frontend URL e.g. https://upbms.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
