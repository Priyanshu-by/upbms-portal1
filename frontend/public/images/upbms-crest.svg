<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2559"/>
      <stop offset="100%" stop-color="#163b88"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#f5b041"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="120" cy="120" r="116" fill="url(#goldGrad)"/>
  <circle cx="120" cy="120" r="109" fill="#ffffff"/>
  <circle cx="120" cy="120" r="104" fill="url(#navyGrad)"/>
  <circle cx="120" cy="120" r="78" fill="none" stroke="#f5b041" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="120" cy="120" r="73" fill="#ffffff"/>

  <!-- Curved Text Paths -->
  <defs>
    <path id="topArc" d="M 30,120 A 90,90 0 1,1 210,120" />
    <path id="bottomArc" d="M 206,128 A 88,88 0 0,1 34,128" />
  </defs>
  <text fill="#ffd166" font-family="sans-serif" font-size="13.5" font-weight="800" letter-spacing="1.2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">उत्तर प्रदेश बैंक मित्र संघ • UPBMS</textPath>
  </text>
  <text fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">एकता • अधिकार • सुरक्षा • सम्मान</textPath>
  </text>

  <!-- Inner Shield -->
  <path d="M120 56 L166 74 L166 118 C166 149 145 170 120 182 C95 170 74 149 74 118 L74 74 Z" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Bank Pillars + Rupee Symbol -->
  <polygon points="120,68 148,82 92,82" fill="#ff9933"/>
  <rect x="96" y="84" width="48" height="4" fill="#ffd166"/>
  <rect x="100" y="90" width="6" height="18" fill="#ffffff"/>
  <rect x="111" y="90" width="6" height="18" fill="#ffffff"/>
  <rect x="123" y="90" width="6" height="18" fill="#ffffff"/>
  <rect x="134" y="90" width="6" height="18" fill="#ffffff"/>
  <rect x="95" y="109" width="50" height="5" fill="#ff9933"/>

  <!-- Unity Handshake Symbol Stylized -->
  <path d="M88 134 Q104 122 120 132 Q136 122 152 134 L145 147 Q132 139 120 147 Q108 139 95 147 Z" fill="url(#goldGrad)"/>
  <circle cx="120" cy="161" r="9" fill="#ff9933"/>
  <text x="120" y="165" text-anchor="middle" fill="#0b2559" font-size="12" font-weight="900" font-family="sans-serif">₹</text>
</svg>